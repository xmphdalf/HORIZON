org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# AGP 9 already defaults buildConfig generation to off, and removed the flag that
# used to set it, so a module that does not need Compose or BuildConfig pays for
# neither without any property here.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# R8 full mode is required by section 5 of scaffolding.md. AGP 9 removed the
# android.enableR8.fullMode flag because full mode is now the only mode, so
# setting it here is both unnecessary and a build warning.
