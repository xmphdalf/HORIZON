name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

permissions:
  contents: read

jobs:
  release:
    name: Verify release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Nothing ships that has not passed the same gates as a pull request.
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Test the build gates
        run: ./gradlew -p build-logic test --stacktrace

      # requirement.md N-09. A user must be able to verify the published binary
      # against this source, which is part of the privacy claim rather than a
      # nicety, so the build is done twice and compared.
      - name: Build twice and compare
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          find app/build/outputs/apk/release -name '*.apk' -exec sha256sum {} \; > /tmp/first.txt
          cat /tmp/first.txt

          ./gradlew clean
          ./gradlew :app:assembleRelease --stacktrace
          find app/build/outputs/apk/release -name '*.apk' -exec sha256sum {} \; > /tmp/second.txt
          cat /tmp/second.txt

          if ! diff <(cut -d' ' -f1 /tmp/first.txt) <(cut -d' ' -f1 /tmp/second.txt); then
            echo "::error::Build is not reproducible. See requirement.md N-09."
            exit 1
          fi
          echo "Build is reproducible."

      - name: APK size
        run: ./gradlew :app:apkSizeCheckRelease --stacktrace

      - name: Publish the checksum alongside the artifact
        run: |
          # Clones repackaged with ads are inevitable under a free licence. The
          # published checksum is how a user tells an official build apart.
          cp /tmp/second.txt app/build/outputs/apk/release/SHA256SUMS.txt
          cat app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 90

  publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: unsigned

      - name: Verify version and sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          apk=unsigned/app-release-unsigned.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          : "${KEYSTORE:?Missing release signing keystore}"
          key="$RUNNER_TEMP/horizon.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out Horizon.apk "$apk"
          "$tools/apksigner" verify --verbose Horizon.apk
          sha256sum Horizon.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" Horizon.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
